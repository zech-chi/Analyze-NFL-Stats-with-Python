<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc">
<title id="title">NFL analysis workflow</title><desc id="desc">Inspect, explore, scale before splitting, fit logistic regression, experiment with settings, and interpret coefficients. The footer explains how to strengthen evaluation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24354b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="55.0" font-size="29" fill="#24354b">FROM GAME STATS TO A WIN CLASSIFIER</text><text x="40" y="90.0" font-size="18" fill="#64748b">The path through the notebook</text><rect x="40" y="125" width="300" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="60" y="162.0" font-size="21" fill="#2563eb">01  Inspect</text><text x="60" y="194.0" font-size="17" fill="#24354b">570 team-game rows</text><text x="60" y="216.1" font-size="17" fill="#24354b">32 teams · 2021 season</text><text x="60" y="238.2" font-size="17" fill="#24354b">Check W / L / T counts</text><rect x="390" y="125" width="300" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="410" y="162.0" font-size="21" fill="#2563eb">02  Explore</text><text x="410" y="194.0" font-size="17" fill="#24354b">Win = 1 · loss or tie = 0</text><text x="410" y="216.1" font-size="17" fill="#24354b">Compare stats with box plots</text><text x="410" y="238.2" font-size="17" fill="#24354b">Select 10 game-stat features</text><rect x="740" y="125" width="300" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="760" y="162.0" font-size="21" fill="#2563eb">03  Prepare</text><text x="760" y="194.0" font-size="17" fill="#24354b">StandardScaler on all rows</text><text x="760" y="216.1" font-size="17" fill="#24354b">Then split train / test</text><text x="760" y="238.2" font-size="17" fill="#24354b">random_state = 42</text><path d="M 348 197 l 34 0" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 698 197 l 34 0" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 890 278 l 0 62" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="350" width="300" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="760" y="387.0" font-size="21" fill="#2563eb">04  Fit</text><text x="760" y="419.0" font-size="17" fill="#24354b">Logistic regression</text><text x="760" y="441.1" font-size="17" fill="#24354b">Start with a 50% test split</text><text x="760" y="463.2" font-size="17" fill="#24354b">Measure classification accuracy</text><rect x="390" y="350" width="300" height="145" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="410" y="387.0" font-size="21" fill="#2563eb">05  Experiment</text><text x="410" y="419.0" font-size="17" fill="#24354b">Compare L1 / L2 and C</text><text x="410" y="441.1" font-size="17" fill="#24354b">Try 20–35% test splits</text><text x="410" y="463.2" font-size="17" fill="#24354b">Final choice: L1, C = 0.1</text><rect x="40" y="350" width="300" height="145" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="60" y="387.0" font-size="21" fill="#047857">06  Interpret</text><text x="60" y="419.0" font-size="17" fill="#24354b">Final test split: 25%</text><text x="60" y="441.1" font-size="17" fill="#24354b">Compare absolute coefficients</text><text x="60" y="463.2" font-size="17" fill="#24354b">Turnovers lead the ranking</text><path d="M 732 422 l -34 0" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 382 422 l -34 0" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="550.0" font-size="18" fill="#64748b">This shows the notebook as written.</text><text x="40" y="579.0" font-size="17" fill="#64748b">For stronger evaluation: split by game first, fit scaling on training data, and tune with validation data.</text></g></svg>
