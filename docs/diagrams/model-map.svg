<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc">
<title id="title">NFL classifier inputs and outputs</title><desc id="desc">Five offensive and five defensive statistics feed logistic regression to classify a win versus a loss or tie. Absolute coefficients describe model influence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24354b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="55.0" font-size="29" fill="#24354b">WHAT GOES INTO THE MODEL?</text><text x="40" y="90.0" font-size="18" fill="#64748b">One row describes one team in one completed game.</text><rect x="40" y="125" width="310" height="200" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="60" y="162.0" font-size="21" fill="#2563eb">OFFENSE · 5 features</text><text x="60" y="194.0" font-size="17" fill="#24354b">First downs gained</text><text x="60" y="216.1" font-size="17" fill="#24354b">Total yards gained</text><text x="60" y="238.2" font-size="17" fill="#24354b">Passing yards gained</text><text x="60" y="260.3" font-size="17" fill="#24354b">Rushing yards gained</text><text x="60" y="282.4" font-size="17" fill="#24354b">Turnovers committed</text><rect x="40" y="360" width="310" height="200" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="60" y="397.0" font-size="21" fill="#047857">DEFENSE · 5 features</text><text x="60" y="429.0" font-size="17" fill="#24354b">First downs allowed</text><text x="60" y="451.1" font-size="17" fill="#24354b">Total yards allowed</text><text x="60" y="473.2" font-size="17" fill="#24354b">Passing yards allowed</text><text x="60" y="495.3" font-size="17" fill="#24354b">Rushing yards allowed</text><text x="60" y="517.4" font-size="17" fill="#24354b">Turnovers forced</text><rect x="405" y="240" width="270" height="195" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="425" y="277.0" font-size="21" fill="#2563eb">LOGISTIC REGRESSION</text><text x="425" y="309.0" font-size="17" fill="#24354b">Standardized inputs</text><text x="425" y="331.1" font-size="17" fill="#24354b">Learn weighted patterns</text><text x="425" y="353.2" font-size="17" fill="#24354b">Estimate win probability</text><text x="425" y="375.3" font-size="17" fill="#24354b">Classify win vs. loss / tie</text><path d="M 358 224 l 38 72" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 358 452 l 38 -72" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="155" width="310" height="125" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="750" y="192.0" font-size="21" fill="#c2410c">OUTCOME LABEL</text><text x="750" y="224.0" font-size="17" fill="#24354b">1 = win</text><text x="750" y="246.1" font-size="17" fill="#24354b">0 = loss or tie</text><rect x="730" y="350" width="310" height="190" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="750" y="387.0" font-size="21" fill="#7c3aed">MODEL INTERPRETATION</text><text x="750" y="419.0" font-size="17" fill="#24354b">Rank absolute coefficients</text><text x="750" y="441.1" font-size="17" fill="#24354b">Largest: turnovers</text><text x="750" y="463.2" font-size="17" fill="#24354b">Next: total yards</text><text x="750" y="485.3" font-size="17" fill="#24354b">Magnitude is not direction</text><path d="M 683 292 l 38 -62" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 683 382 l 38 62" fill="none" stroke="#24354b" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="618.0" font-size="17" fill="#64748b">Scores, team identity, opponent, week, day, and date are excluded from the feature matrix.</text><text x="40" y="649.0" font-size="17" fill="#64748b">These are completed-game inputs: the notebook studies outcomes rather than forecasting before kickoff.</text></g></svg>
